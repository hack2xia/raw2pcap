name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # .python-version pins 3.11; uv installs it on demand.
      - run: uv sync --locked

      - run: uv run ruff check .

      - run: uv run ruff format --check .

      - run: uv run pytest -q
