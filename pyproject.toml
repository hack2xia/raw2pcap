[project]
name = "raw2pcap"
version = "0.1.0"
description = "Create pcap files from raw HTTP request/response text, purely in software"
requires-python = ">=3.10"
dependencies = [
    "scapy>=2.5",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=7",
    "httpx>=0.24",
    "ruff>=0.1",
]

[project.scripts]
raw2pcap = "raw2pcap.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "SIM", "B", "RUF", "ASYNC", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
