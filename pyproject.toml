[project]
name = "raw2pcap"
version = "0.1.2"
description = "Create pcap files from raw HTTP/1.x request/response text, purely in software"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "hack2xia" }]
keywords = ["pcap", "http", "wireshark", "tcp", "scapy", "packet-capture"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "scapy>=2.7,<3",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "python-multipart>=0.0.9",
]

[project.urls]
Repository = "https://github.com/hack2xia/raw2pcap"

[dependency-groups]
dev = [
    "pytest>=7",
    "httpx>=0.24",
    "ruff>=0.1",
]

[project.scripts]
raw2pcap = "raw2pcap.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "SIM", "B", "RUF", "ASYNC", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
