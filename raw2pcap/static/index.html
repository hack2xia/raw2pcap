<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>raw2pcap</title>
<style>
  :root {
    --cream: #f5f4ee;
    --cream-deep: #eeece3;
    --paper: #fbfaf7;
    --ink: #26251f;
    --ink-soft: #6f6c60;
    --ink-faint: #a3a08f;
    --line: #e3e0d4;
    --coral: #d97757;
    --coral-deep: #c2613f;
    --coral-soft: rgba(217, 119, 87, 0.12);
    --danger: #b4452f;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: "Söhne", -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--cream);
    color: var(--ink);
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 28px;
    border-bottom: 1px solid var(--line);
    background: var(--paper);
  }
  header .mark {
    height: 26px;
    padding: 0 9px;
    border-radius: 7px;
    background: var(--coral);
    display: grid;
    place-items: center;
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    font-family: Georgia, serif;
  }
  header .title {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.2px;
  }
  header .sub {
    font-size: 13px;
    color: var(--ink-soft);
    margin-left: 4px;
    padding-left: 14px;
    border-left: 1px solid var(--line);
  }
  main {
    flex: 1;
    width: 100%;
    max-width: 1320px;
    margin: 0 auto;
    padding: 24px 28px;
    display: flex;
    flex-direction: column;
  }
  #f { flex: 1; display: flex; flex-direction: column; }
  .panels {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr;
    gap: 22px;
    min-height: 0;
  }
  @media (max-width: 800px) { .panels { grid-template-columns: 1fr; } }
  .panel {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: 0 1px 2px rgba(38, 37, 31, 0.04), 0 4px 16px rgba(38, 37, 31, 0.05);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .panel:focus-within {
    border-color: var(--coral);
    box-shadow: 0 0 0 3px var(--coral-soft), 0 4px 16px rgba(38, 37, 31, 0.06);
  }
  .panel label {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--ink-soft);
    background: var(--cream-deep);
    border-bottom: 1px solid var(--line);
  }
  .panel label .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
  }
  .panel.req label .dot { background: var(--coral); }
  .panel.res label .dot { background: #8a9a5b; }
  .panel textarea {
    flex: 1;
    border: none;
    outline: none;
    resize: none;
    padding: 14px 16px;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 13px;
    line-height: 1.6;
    color: var(--ink);
    background: var(--paper);
  }
  .panel textarea::placeholder { color: var(--ink-faint); }
  .controls {
    margin-top: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .filename-box {
    display: flex;
    align-items: center;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 9px;
    overflow: hidden;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .filename-box:focus-within {
    border-color: var(--coral);
    box-shadow: 0 0 0 3px var(--coral-soft);
  }
  .filename-box input {
    border: none;
    outline: none;
    padding: 10px 4px 10px 14px;
    font-size: 14px;
    width: 260px;
    background: transparent;
    color: var(--ink);
  }
  .filename-box .ext {
    padding: 10px 14px 10px 0;
    color: var(--ink-faint);
    font-size: 14px;
    font-family: "SFMono-Regular", Consolas, monospace;
  }
  button {
    background: var(--coral);
    color: #fff;
    border: none;
    border-radius: 9px;
    padding: 11px 26px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.2px;
    cursor: pointer;
    box-shadow: 0 1px 2px rgba(194, 97, 63, 0.35);
    transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
  }
  button:hover { background: var(--coral-deep); box-shadow: 0 3px 10px rgba(194, 97, 63, 0.35); }
  button:active { transform: translateY(1px); }
  button:disabled { background: #e2a68f; cursor: not-allowed; box-shadow: none; }
  #err, #warn {
    font-size: 13px;
    display: none;
    border-radius: 8px;
    padding: 8px 12px;
    flex-basis: 100%;
  }
  #err {
    color: var(--danger);
    background: rgba(180, 69, 47, 0.08);
    border: 1px solid rgba(180, 69, 47, 0.25);
  }
  #warn {
    color: #8a6d1d;
    background: rgba(202, 158, 46, 0.10);
    border: 1px solid rgba(202, 158, 46, 0.35);
  }
  #err div, #warn div { padding: 2px 0; }
</style>
</head>
<body>
<header>
  <span class="mark">r2p</span>
  <span class="title">raw2pcap</span>
  <span class="sub">Raw HTTP &rarr; pcap, synthesized in memory</span>
</header>
<main>
  <form id="f">
    <div class="panels">
      <div class="panel req">
        <label><span class="dot"></span>Request &middot; required</label>
        <textarea name="inputRequest" spellcheck="false"
          placeholder="GET / HTTP/1.1&#10;Host: example.com"></textarea>
      </div>
      <div class="panel res">
        <label><span class="dot"></span>Response &middot; optional</label>
        <textarea name="inputResponse" spellcheck="false"
          placeholder="HTTP/1.1 200 OK&#10;Content-Type: text/html&#10;&#10;Leave empty for a canned 200 response."></textarea>
      </div>
    </div>
    <div class="controls">
      <div class="filename-box">
        <input id="filename" name="filename" value="raw2pcap-result"
               placeholder="filename" autocomplete="off">
        <span class="ext">.pcap</span>
      </div>
      <button id="btn" type="submit">Create Pcap</button>
      <span id="err"></span>
      <span id="warn"></span>
    </div>
  </form>
</main>
<script src="/static/app.js"></script>
</body>
</html>
